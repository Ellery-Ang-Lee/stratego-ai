<!DOCTYPE html>
<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>

    <link rel="icon" href="./redfavicon.ico">


    <title>Stratego</title>
</head>

<body>
    <style>
        :root {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body {
            margin: 0;
        }

        #controls {
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Black Ops One", system-ui;
            gap: 1rem;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 1px;
            aspect-ratio: 1 / 1;
            height: 88vh;
        }

        .cell {
            position: relative;
            font-family: "Black Ops One", system-ui;
            font-size: 200%;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            aspect-ratio: 1 / 1;
        }

        .cell::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            /* transition: opacity 0.3s ease; */
        }

        .cell:hover::after {
            opacity: 1;
        }

        .cell.selected::after {
            opacity: 1;
            background-color: rgba(255, 255, 0, 0.6);
        }

        .cell.highlighted::after {
            opacity: 1;
            background-color: rgba(253, 253, 253, 0.34);
        }
    </style>
    <div id="controls">
        <label for="redteam">
            Red Team
            <input type="checkbox" id="redteam" checked onclick="render()">
        </label>

        <label for="showopponent">
            Show Opponent
            <input type="checkbox" id="showopponent" onclick="render()">
        </label>

        <span style="font-size: 2em;" id="turn">Red Turn</span>

        <label for="useicons">
            Use Icons
            <input type="checkbox" id="useicons" onclick="saveUseIcons(); render()">
        </label>


        <div>
            <input type="text" id="serverip" placeholder="IP Address" onchange="setServerIp(this.value)">
            <br>
            <span id="connstatus">Not Connected</span>
        </div>

    </div>
    <div id="board">
    </div>

    <script>
        let game = "GMDEDEGBBFEDHEBGBEGDIJCJIDDIBDFHKLFHDBHFAA__AA__AAAA__AA__AAPPUXPRWUNNPQTRUTPQRSSTNVPPOVNRQNYNSQSPTQ";

        let revealed = -1;

        let selected = -1;

        const board = document.getElementById('board');
        for (let i = 0; i < 100; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.id = "cell" + i;
            cell.onclick = () => cellclick(i);
            cell.style.backgroundColor = [42, 43, 46, 47, 52, 53, 56, 57].includes(i) ? '#0055ff' : '#33dd22';
            board.appendChild(cell);
        }

        // GRAVON_TO_RANK = {
        //     "B": BOMB, "N": BOMB, "C": SPY, "O": SPY,
        //     "D": SCOUT, "P": SCOUT, "E": MINER, "Q": MINER,
        //     "F": SERGEANT, "R": SERGEANT, "G": LIEUTENANT, "S": LIEUTENANT,
        //     "H": CAPTAIN, "T": CAPTAIN, "I": MAJOR, "U": MAJOR,
        //     "J": COLONEL, "V": COLONEL, "K": GENERAL, "W": GENERAL,
        //     "L": MARSHAL, "X": MARSHAL, "M": FLAG, "Y": FLAG,
        //     "A": EMPTY, "_": LAKE
        // }

        const red = {
            "B": "Bomb",
            "C": "Spy",
            "D": "Scout",
            "E": "Miner",
            "F": "Sergeant",
            "G": "Lieutenant",
            "H": "Captain",
            "I": "Major",
            "J": "Colonel",
            "K": "General",
            "L": "Marshal",
            "M": "Flag",
        };

        const blue = {
            "N": "Bomb",
            "O": "Spy",
            "P": "Scout",
            "Q": "Miner",
            "R": "Sergeant",
            "S": "Lieutenant",
            "T": "Captain",
            "U": "Major",
            "V": "Colonel",
            "W": "General",
            "X": "Marshal",
            "Y": "Flag"
        };

        const rank = {
            "Flag": "F",
            "Spy": "1",
            "Scout": "2",
            "Miner": "3",
            "Sergeant": "4",
            "Lieutenant": "5",
            "Captain": "6",
            "Major": "7",
            "Colonel": "8",
            "General": "9",
            "Marshal": "10",
            "Bomb": "B"
        }

        // Icons from https://vector.gissen.nl/stratego.html
        function render() {
            for (let i = 0; i < 100; i++) {
                const cell = document.getElementById("cell" + i);

                let redteam = document.getElementById('redteam').checked;
                let showopponent = document.getElementById('showopponent').checked;

                let piece = game.charAt(redteam ? 99 - i : i);

                cell.style.backgroundColor = piece == "_" ? '#0055ff' : '#33dd22';
                // cell.style.background = piece == "_" ? 'url(https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExbThxM3NjeG40d3h1a204bTl4MW5xank3ZmVmY3dpdTlxcW11MGtibiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QjkkR8Nn0clgYcnOtC/giphy.gif)' : '#33dd22';

                if (showopponent || i == revealed || !redteam && blue[piece] || redteam && red[piece]) {

                    if (piece == "_" || piece == "A") {
                        cell.innerHTML = "";
                    } else {
                        cell.innerHTML = `<div style="position: relative; display: flex; align-items: center; justify-content: center;">`;
                        cell.innerHTML += `<img id="castle${i}" style="height: 2.2em; width: auto;" src="${blue[piece] ? "blue" : "red"}castle.svg"/>`
                        if (document.getElementById("useicons").checked)
                            cell.innerHTML += `<img style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%); height: 2.0em; width: auto; filter: invert(1);" src="stratego-${String(red[piece] || blue[piece]).toLowerCase()}.svg"/>`
                        else
                            cell.innerHTML += `<span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%); color: white;">${piece == "_" || piece == "A" ? "" : rank[red[piece] || blue[piece]]}</span>`;
                        cell.innerHTML += "</div>";
                    }

                } else {
                    // cell.innerHTML = piece == "_" || piece == "A" ? "" : "?";

                    if (piece == "_" || piece == "A") {
                        cell.innerHTML = "";
                    } else {
                        cell.innerHTML = `<div style="position: relative; display: flex; align-items: center; justify-content: center;">`;
                        cell.innerHTML += `<img id="castle${i}" style="height: 2.2em; width: auto;" src="${blue[piece] ? "blue" : "red"}castle.svg"/>`
                        cell.innerHTML += "</div>";
                    }
                }

                // cell.style.color = red[piece] ? 'red' : blue[piece] ? 'blue' : 'black';
            }
        }

        // Restore Use Icons preference
        document.getElementById("useicons").checked = localStorage.getItem("useicons") === "true";

        function saveUseIcons() {
            localStorage.setItem("useicons", document.getElementById("useicons").checked);
        }

        render();

        function cellclick(i) {
            let redteam = document.getElementById('redteam').checked;
            let piece = game.charAt(redteam ? 99 - i : i);

            if (redteam && !red[piece] || !redteam && !blue[piece]) {
                for (let j = 0; j < 100; j++) {
                    if (document.getElementById("cell" + j).classList.contains("selected")) {
                        selected = j
                        break;
                    }
                }

                if (selected >= 0) {
                    for (let j = 0; j < 100; j++) {
                        document.getElementById("cell" + j).classList.remove("selected");
                    }

                    if (redteam) {
                        ws.send(JSON.stringify({ type: "move", data: `${selected},${i}` }));
                    } else {
                        ws.send(JSON.stringify({ type: "move", data: `${99 - selected},${99 - i}` }));
                    }

                    selected = -1;
                }

                return;
            }

            for (let j = 0; j < 100; j++) {
                document.getElementById("cell" + j).classList.remove("selected");
            }

            document.getElementById("cell" + i).classList.add("selected");
        }

        function move(from, to) {
            revealed = to;
            render();

            console.log("turn changed");
            ws.send(JSON.stringify({ type: "turn", data: "blue" }));
            document.getElementById("turn").innerText = "Blue Turn";
            document.querySelector("link[rel~='icon']").href = "./bluefavicon.ico";
        }

        // Restore server IP preference
        let ip = localStorage.getItem("serverip") || "50.125.81.40";
        document.getElementById("serverip").value = ip;

        let ws = null;
        let reconnectTimer = null;

        function setStatus(text) {
            document.getElementById("connstatus").innerText = text;
        }

        function setServerIp(value) {
            ip = value.trim();
            localStorage.setItem("serverip", ip);
            // Reconnect to the new address
            if (ws) {
                ws.onclose = null; // prevent the old socket from triggering a reconnect
                ws.close();
            }
            connect();
        }

        function heavyconfetti(x, y, intensity) {
            for (var i = 0; i < intensity; i++)
                confetti({ position: { x: window.innerWidth * x, y: window.innerHeight * y } })
        }

        function connect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            if (!ip) {
                setStatus("Not Connected");
                return;
            }

            setStatus("Connecting...");
            ws = new WebSocket(`ws://${ip}:8081`);

            ws.onmessage = (e) => {
                // console.log(e);

                let json = JSON.parse(e.data);

                if (json) {
                    switch (json.type) {
                        case "game":
                            let lastgame = game;
                            game = json.data.split("").reverse().join("")

                            for (var i = 0; i < 100; i++) {
                                if (lastgame[i] !== game[i]) {
                                    document.getElementById("cell" + (redteam ? 99 - i : i)).classList.add("highlighted");
                                } else {
                                    document.getElementById("cell" + (redteam ? 99 - i : i)).classList.remove("highlighted");
                                }
                            }

                            render();
                            break;
                        case "turn":
                            if (json.data == "red") {
                                document.getElementById("turn").innerText = "Red Turn"
                                document.querySelector("link[rel~='icon']").href = "./redfavicon.ico";
                                revealed = -1;
                                //uncomment to have it play itself
                                //ws.send(JSON.stringify({ type: "turn", data: "blue" }));
                            }
                            break;
                        case "reveal":
                            revealed = json.data;
                            render();
                            break;
                        case "move":
                            if (json.data == "invalid") {
                                alert("Invalid Move!");
                            } else {
                                move(json.data.split(",")[0], json.data.split(",")[1]);
                            }
                            break;
                        case "win":
                            if ((json.data == "red") == document.getElementById("redteam").checked) {
                                setTimeout(() => { heavyconfetti(0.25, 0.25, 20) }, 1000);
                                setTimeout(() => { heavyconfetti(0.75, 0.50, 20) }, 1500);
                                setTimeout(() => { heavyconfetti(0.35, 0.75, 20) }, 2000);
                                document.getElementById("turn").innerText = "You Win!"
                            } else {
                                document.getElementById("turn").innerText = "You Lost :("
                            }
                            break;
                        default:
                            alert("Failed to handle JSON: " + e.data);
                            break;

                    }
                } else {
                    alert("Failed to parse JSON");
                }
            }

            ws.onopen = () => {
                console.log("Websocket Connected");
                setStatus("Connected");
                // console.log(JSON.stringify({type: "game", data: game}));
                ws.send(JSON.stringify({ type: "game", data: game.split("").reverse().join("") }));
            }

            ws.onclose = () => {
                console.log("Websocket Closed, reconnecting...");
                setStatus("Connecting...");
                reconnectTimer = setTimeout(connect, 2000);
            }

            ws.onerror = (e) => {
                console.log("Websocket Error", e);
                // onclose fires after onerror and handles the reconnect
            }
        }

        connect();

    </script>
</body>

</html>
